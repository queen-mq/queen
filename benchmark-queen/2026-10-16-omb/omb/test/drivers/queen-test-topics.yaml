# driver-queen on the two test VMs (10-17): one broker at 10.250.0.42, verify on.
name: Queen
driverClass: io.openmessaging.benchmark.driver.queen.QueenBenchmarkDriver
urls:
  - http://10.250.0.42:6632
dedupWindowSeconds: 60
lingerMs: 1
