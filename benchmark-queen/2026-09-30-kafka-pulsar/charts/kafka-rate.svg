<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Kafka rate series"><title>Kafka rate series</title>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ref { stroke: #898781; stroke-width: 1; stroke-dasharray: 3 4; }
  .k { stroke: #2a78d6; } .kf { fill: #2a78d6; } .q { stroke: #eb6834; } .qf { fill: #eb6834; }
  .ring { stroke: #fcfcfb; } .hollow { fill: #fcfcfb; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dash { stroke-dasharray: 5 4; }
  text { font-size: 12px; } .t { font-size: 15px; font-weight: 600; } .st { font-size: 12px; }
  .lab { font-size: 12px; font-weight: 600; } .small { font-size: 11px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .k { stroke: #3987e5; } .kf { fill: #3987e5; } .q { stroke: #d95926; } .qf { fill: #d95926; }
    .ring { stroke: #1a1a19; } .hollow { fill: #1a1a19; }
  }
</style><rect class="bg" width="820" height="420" rx="8"/><text class="ink t" x="24" y="32">Kafka 4.3.1 keeps up to 4M msg/s at 200 partitions</text><text class="ink2 st" x="24" y="52">3 brokers × 16 vCPU (RF 3, acks=all, idempotent, lz4) · 1 topic × 200 partitions · 256 B JSON in 100-message units</text><text class="ink2 st" x="24" y="70">every rate delivered in = out, 0 shed, 0 errors · 60 s windows, last 30 s · 2026-09-30</text><line class="grid" x1="70" x2="380" y1="340.0" y2="340.0"/><text class="muted" x="62" y="344.0" text-anchor="end">0</text><line class="grid" x1="70" x2="380" y1="282.5" y2="282.5"/><text class="muted" x="62" y="286.5" text-anchor="end">20</text><line class="grid" x1="70" x2="380" y1="225.0" y2="225.0"/><text class="muted" x="62" y="229.0" text-anchor="end">40</text><line class="grid" x1="70" x2="380" y1="167.5" y2="167.5"/><text class="muted" x="62" y="171.5" text-anchor="end">60</text><line class="grid" x1="70" x2="380" y1="110.0" y2="110.0"/><text class="muted" x="62" y="114.0" text-anchor="end">80</text><line class="axis" x1="70" x2="380" y1="340" y2="340"/><line class="axis" x1="143.8" x2="143.8" y1="340" y2="344"/><text class="muted" x="143.8" y="358" text-anchor="middle">1M</text><line class="axis" x1="217.6" x2="217.6" y1="340" y2="344"/><text class="muted" x="217.6" y="358" text-anchor="middle">2M</text><line class="axis" x1="291.4" x2="291.4" y1="340" y2="344"/><text class="muted" x="291.4" y="358" text-anchor="middle">3M</text><line class="axis" x1="365.2" x2="365.2" y1="340" y2="344"/><text class="muted" x="365.2" y="358" text-anchor="middle">4M</text><text class="ink2" x="225.0" y="376" text-anchor="middle">offered msg/s</text><text class="ink2" x="70" y="98">end-to-end latency (ms)</text><line class="axis" x1="70" x2="380" y1="340" y2="340"/><line class="axis" x1="70.0" x2="70.0" y1="340" y2="344"/><text class="muted" x="70.0" y="358" text-anchor="middle">0</text><line class="ref" x1="143.8" x2="143.8" y1="110" y2="340"/><text class="muted small" x="148.8" y="122.0" text-anchor="start">Queen's ceiling on this rig (≈1M)</text><path class="line k" d="M92.1,311.2 L114.3,302.6 L143.8,288.2 L180.7,239.4 L217.6,170.4 L291.4,127.2 L365.2,124.4"/><path class="line k dash" d="M92.1,317.0 L114.3,317.0 L143.8,317.0 L180.7,317.0 L217.6,314.1 L291.4,314.1 L365.2,291.1"/><circle cx="92.1" cy="311.2" r="4.5" class="kf ring" stroke-width="2"><title>0.3M msg/s: e2e p99 10 ms, p50 8 ms</title></circle><circle cx="92.1" cy="317.0" r="4.5" class="kf ring" stroke-width="2"><title>0.3M msg/s: e2e p50 8 ms</title></circle><circle cx="114.3" cy="302.6" r="4.5" class="kf ring" stroke-width="2"><title>0.6M msg/s: e2e p99 13 ms, p50 8 ms</title></circle><circle cx="114.3" cy="317.0" r="4.5" class="kf ring" stroke-width="2"><title>0.6M msg/s: e2e p50 8 ms</title></circle><circle cx="143.8" cy="288.2" r="4.5" class="kf ring" stroke-width="2"><title>1M msg/s: e2e p99 18 ms, p50 8 ms</title></circle><circle cx="143.8" cy="317.0" r="4.5" class="kf ring" stroke-width="2"><title>1M msg/s: e2e p50 8 ms</title></circle><circle cx="180.7" cy="239.4" r="4.5" class="kf ring" stroke-width="2"><title>1.5M msg/s: e2e p99 35 ms, p50 8 ms</title></circle><circle cx="180.7" cy="317.0" r="4.5" class="kf ring" stroke-width="2"><title>1.5M msg/s: e2e p50 8 ms</title></circle><circle cx="217.6" cy="170.4" r="4.5" class="kf ring" stroke-width="2"><title>2M msg/s: e2e p99 59 ms, p50 9 ms</title></circle><circle cx="217.6" cy="314.1" r="4.5" class="kf ring" stroke-width="2"><title>2M msg/s: e2e p50 9 ms</title></circle><circle cx="291.4" cy="127.2" r="4.5" class="kf ring" stroke-width="2"><title>3M msg/s: e2e p99 74 ms, p50 9 ms</title></circle><circle cx="291.4" cy="314.1" r="4.5" class="kf ring" stroke-width="2"><title>3M msg/s: e2e p50 9 ms</title></circle><circle cx="365.2" cy="124.4" r="4.5" class="kf ring" stroke-width="2"><title>4M msg/s: e2e p99 75 ms, p50 17 ms</title></circle><circle cx="365.2" cy="291.1" r="4.5" class="kf ring" stroke-width="2"><title>4M msg/s: e2e p50 17 ms</title></circle><text class="ink lab" x="375.2" y="128.4" text-anchor="start">p99 75 ms</text><text class="ink lab" x="375.2" y="295.1" text-anchor="start">p50 17 ms</text><line class="grid" x1="500" x2="790" y1="340.0" y2="340.0"/><text class="muted" x="492" y="344.0" text-anchor="end">0</text><line class="grid" x1="500" x2="790" y1="263.3" y2="263.3"/><text class="muted" x="492" y="267.3" text-anchor="end">16</text><line class="grid" x1="500" x2="790" y1="186.7" y2="186.7"/><text class="muted" x="492" y="190.7" text-anchor="end">32</text><line class="grid" x1="500" x2="790" y1="110.0" y2="110.0"/><text class="muted" x="492" y="114.0" text-anchor="end">48</text><line class="axis" x1="500" x2="790" y1="340" y2="340"/><line class="axis" x1="569.0" x2="569.0" y1="340" y2="344"/><text class="muted" x="569.0" y="358" text-anchor="middle">1M</text><line class="axis" x1="638.1" x2="638.1" y1="340" y2="344"/><text class="muted" x="638.1" y="358" text-anchor="middle">2M</text><line class="axis" x1="707.1" x2="707.1" y1="340" y2="344"/><text class="muted" x="707.1" y="358" text-anchor="middle">3M</text><line class="axis" x1="776.2" x2="776.2" y1="340" y2="344"/><text class="muted" x="776.2" y="358" text-anchor="middle">4M</text><text class="ink2" x="645.0" y="376" text-anchor="middle">offered msg/s</text><text class="ink2" x="500" y="98">Kafka CPU, 3 brokers summed (cores of 48)</text><path class="line k" d="M520.7,322.8 L541.4,309.8 L569.0,293.5 L603.6,279.6 L638.1,270.5 L707.1,251.8 L776.2,247.0"/><circle cx="520.7" cy="322.8" r="4.5" class="kf ring" stroke-width="2"><title>0.3M msg/s: Kafka 3.6 cores (3 brokers)</title></circle><circle cx="541.4" cy="309.8" r="4.5" class="kf ring" stroke-width="2"><title>0.6M msg/s: Kafka 6.3 cores (3 brokers)</title></circle><circle cx="569.0" cy="293.5" r="4.5" class="kf ring" stroke-width="2"><title>1M msg/s: Kafka 9.7 cores (3 brokers)</title></circle><circle cx="603.6" cy="279.6" r="4.5" class="kf ring" stroke-width="2"><title>1.5M msg/s: Kafka 12.6 cores (3 brokers)</title></circle><circle cx="638.1" cy="270.5" r="4.5" class="kf ring" stroke-width="2"><title>2M msg/s: Kafka 14.5 cores (3 brokers)</title></circle><circle cx="707.1" cy="251.8" r="4.5" class="kf ring" stroke-width="2"><title>3M msg/s: Kafka 18.4 cores (3 brokers)</title></circle><circle cx="776.2" cy="247.0" r="4.5" class="kf ring" stroke-width="2"><title>4M msg/s: Kafka 19.4 cores (3 brokers)</title></circle><text class="ink lab" x="772.2" y="233.0" text-anchor="end">19 cores</text><text class="muted small" x="24" y="398">At 4M: 580 MB/s disk writes and 594 MB/s network per broker; the limit ahead is bandwidth, not CPU. Dashed line = p50, solid = p99.</text></svg>
