9 140 ms</title></circle><circle cx="627.9" cy="164.5" r="4.5" class="qf ring" stroke-width="2"><title>Queen 1.5M: e2e p50 1.5 s, p99 4.3 s</title></circle><circle cx="667.1" cy="138.4" r="4.5" class="qf ring" stroke-width="2"><title>Queen 2M: e2e p50 8.8 s, p99 10.6 s</title></circle><text class="ink lab" x="814.3" y="271.6" text-anchor="end">Kafka</text><text class="ink lab" x="677.1" y="142.4" text-anchor="start">Queen</text><text class="muted small" x="24" y="418">Queen at 2M offered: 1.39M in, 603k/s shed by the loaders. Hover a mark for p50 and p99.</text></svg>
