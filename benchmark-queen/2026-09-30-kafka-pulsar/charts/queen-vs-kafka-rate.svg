</style><rect class="bg" width="900" height="440" rx="8"/><text class="ink t" x="24" y="32">At 200 partitions Kafka carries 4M msg/s; Queen tops out near 1.4M</text><text class="ink2 st" x="24" y="52">Same 3 brokers × 16 vCPU and loaders, 1 topic / queue × 200 partitions, 256 B JSON in 100-message units, 60 s, last 30 s</text><text class="ink2 st" x="24" y="70">Kafka 4.3.1: RF 3, acks=all, lz4, 8 replica fetchers · Queen final build: raft 3 nodes, dedup off, 4 loaders</text><line class="grid" x1="80" x2="410" y1="360.0" y2="360.0"/><text class="muted" x="72" y="364.0" text-anchor="end">0</text><line class="grid" x1="80" x2="410" y1="302.9" y2="302.9"/><text class="muted" x="72" y="306.9" text-anchor="end">1M</text><line class="grid" x1="80" x2="410" y1="245.7" y2="245.7"/><text class="muted" x="72" y="249.7" text-anchor="end">2M</text><line class="grid" x1="80" x2="410" y1="188.6" y2="188.6"/><text class="muted" x="72" y="192.6" text-anchor="end">3M</text><line class="grid" x1="80" x2="410" y1="131.4" y2="131.4"/><text class="muted" x="72" y="135.4" text-anchor="end">4M</text><line class="axis" x1="80" x2="410" y1="360" y2="360"/><line class="axis" x1="158.6" x2="158.6" y1="360" y2="364"/><text class="muted" x="158.6" y="378" text-anchor="middle">1M</text><line class="axis" x1="237.1" x2="237.1" y1="360" y2="364"/><text class="muted" x="237.1" y="378" text-anchor="middle">2M</text><line class="axis" x1="315.7" x2="315.7" y1="360" y2="364"/><text class="muted" x="315.7" y="378" text-anchor="middle">3M</text><line class="axis" x1="394.3" x2="394.3" y1="360" y2="364"/><text class="muted" x="394.3" y="378" text-anchor="middle">4M</text><text class="ink2" x="245.0" y="396" text-anchor="middle">offered msg/s</text><text class="ink2" x="80" y="108">delivered (consumed) msg/s</text><line class="ref" x1="80.0" y1="360.0" x2="410.0" y2="120.0"/><text class="muted small" x="333.3" y="165.4" text-anchor="end">delivered = offered</text><path class="line k" d="M103.6,342.9 L127.1