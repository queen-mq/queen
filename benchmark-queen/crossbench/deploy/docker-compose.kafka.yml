# Kafka under test: single-node KRaft, no ZooKeeper.
#
# DURABILITY WARNING (SPEC.md §5.3). With the default settings below Kafka does
# NOT fsync per write: it acknowledges once the record is in the page cache of
# the required replicas and flushes lazily. On a single broker that is a weaker
# durability tier than Postgres synchronous_commit=on, which is what the Queen
# and pgmq runs use.
#
# So Kafka is run TWICE and both results are published:
#   CM_KAFKA_DURABILITY=default   how Kafka is actually deployed
#   CM_KAFKA_DURABILITY=fsync     flush.messages=1, tier-matched to Postgres
# Pass the same value to cmbench -durability so the result file records it.
#
#   docker compose -f docker-compose.kafka.yml up -d
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    container_name: cmbench-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The advertised listener is what clients RECONNECT to after bootstrap, so
      # it must be the address the loader can actually reach: the broker VM's IP
      # and the PUBLISHED port. Getting this wrong fails at the second hop with
      # a confusing "connection refused" against the bootstrap address.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The workload creates its own topics with an explicit partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # A consumer group per stage, twelve stages, several members each: the
      # default of 50 offset partitions is fine, but the group coordinator load
      # is part of what we measure, so it is left at the default on purpose.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 2
      # Sized like the Postgres side: a quarter of RAM for the JVM heap, the
      # rest left to the page cache, which is where Kafka wants it.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx4g -Xms4g}
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "${CM_CPUS:-8}"
          memory: ${CM_MEM:-16g}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  kafka-data:
