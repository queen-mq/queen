# RabbitMQ configuration for CM-BENCH.
#
# The goal is to let RabbitMQ reach its OWN ceiling rather than one we imposed:
# thousands of queues, thousands of channels, persistent messages, publisher
# confirms. Every value here that is not a default exists to remove an
# artificial limit, not to buy throughput.

# Memory: alarm at 70% of the container limit. Hitting this blocks publishers,
# which the harness will see as back-pressure and the report must call out as
# "RabbitMQ flow-controlled" rather than "the loader slowed down".
vm_memory_high_watermark.relative = 0.7

# Disk: this workload persists everything, including the x5 fan-out copies of
# the ~2 KB flow-B payload.
disk_free_limit.absolute = 5GB

# Thousands of ordered lanes means thousands of queues and channels.
channel_max = 8000

# Consumer timeout: a lane batch can legitimately take a while when a property
# is slow, and the default 30 minutes is fine, but make it explicit so nobody
# later blames a mid-run channel close on an invisible default.
consumer_timeout = 1800000

# Lazy-ish behaviour for classic queues: this workload's queues are meant to
# stay near-empty, so keep messages in memory and let the report show what
# happens when they do not.
management.rates_mode = basic

# Log at info: the campaign wants flow-control and alarm events in the record.
log.console = true
log.console.level = info
