global
    maxconn 200000
    log stdout format raw local0 info
    stats socket /tmp/haproxy.sock mode 600 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # A parked pop legitimately holds the connection up to 30 s server-side.
    # Any timeout below that cuts a HEALTHY consumer and manufactures an error
    # the broker never returned.
    timeout client 130s
    timeout server 130s
    timeout tunnel 130s
    timeout http-keep-alive 60s

frontend brokers_fe
    bind :6630
    default_backend brokers_be

backend brokers_be
    # ACTIVE / PASSIVE. All traffic to broker-a; broker-b takes over only when
    # broker-a fails its health check.
    #
    # Why not active/active with tenant-hash affinity: hashing needs enough keys
    # to balance. Measured on this cell with 35 full-quota tenants the split was
    # 28/72, and the loaded broker's ready_age_p95 hit 3273 ms while the other
    # sat at 85 ms — the cell's ceiling became "whichever broker drew the long
    # straw" rather than its real capacity. One active broker gives complete
    # locality and no distribution question; the standby is for availability.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200

    # inter 1s / fall 2 gives ~2-3 s detection. The entire failover cost lives
    # inside the detection window: at inter 2s / fall 3 it measured 13 s.
    # on-marked-down shutdown-sessions matters with long-poll — parked pops on a
    # dead broker are cut deliberately instead of hanging to the timeout.
    server broker-a cell-broker-a:6632 check inter 1s fall 2 rise 2 maxconn 100000 on-marked-down shutdown-sessions
    server broker-b cell-broker-b:6632 check inter 1s fall 2 rise 2 maxconn 100000 on-marked-down shutdown-sessions backup

frontend stats_fe
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
