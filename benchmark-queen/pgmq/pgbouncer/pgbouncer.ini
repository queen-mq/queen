[databases]
; Upstream credentials live here; client-side auth is trust (local bench net only).
postgres = host=postgres port=5432 dbname=postgres user=postgres password=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

; trust is fine here: this stack is a throwaway local benchmark network.
; Do NOT copy this auth setup into anything real.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; THE knob that makes this a fair pgmq deployment: transaction pooling lets
; thousands of client connections share a small set of real PG backends.
pool_mode = transaction

; How many client connections we accept (set high enough for the 1000-conn sweep).
max_client_conn = 4000

; The real backend pool against Postgres. This is the number to compare against
; Queen's ~2.5 active connections. Tune via the file for the real run.
default_pool_size = 64
min_pool_size = 8
reserve_pool_size = 16
reserve_pool_timeout = 1

; node-postgres sends these startup params; let them through in txn mode.
ignore_startup_parameters = extra_float_digits,options,search_path
server_reset_query = DISCARD ALL

admin_users = postgres
stats_users = postgres
