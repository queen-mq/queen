name: pgmq-bench

# 32 vCPU / 62 GiB host variant (DigitalOcean 206.189.51.203) for the pgmq
# saturation sweep. Differences vs docker-compose.yml: no CPU/mem caps (PG gets
# the whole box), max_connections raised for the direct-connection sweep,
# bigger shared_buffers / WAL, aggressive autovacuum (pgmq's best shot at
# keeping up with read=UPDATE(vt)+DELETE churn). synchronous_commit=on.
#
# Direct PG is published on host :55432 (the harness points at it with
# PGPORT=55432). PgBouncer stays up but unused for the direct sweep.

services:
  postgres:
    image: ${PGMQ_IMAGE:-ghcr.io/pgmq/pg17-pgmq:latest}
    container_name: pgmq-postgres
    command:
      - postgres
      - -c
      - max_connections=2000
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-16GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-40GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=32GB
      - -c
      - synchronous_commit=on
      - -c
      - autovacuum_naptime=5s
      - -c
      - autovacuum_vacuum_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_delay=0
      - -c
      - autovacuum_max_workers=6
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${PG_HOST_PORT:-55432}:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    shm_size: "8gb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgmq-pgbouncer
    entrypoint: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "${PGB_HOST_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
