version: 2

project_name: queenctl

# This subproject lives inside the queen-mq/queen monorepo. Release tags
# are shaped `clients/client-cli/vX.Y.Z` to satisfy Go's module proxy
# convention for nested modules. GoReleaser would otherwise try to parse the
# whole tag string as semver and fail. We strip the directory prefix in the
# release workflow by exporting GORELEASER_CURRENT_TAG; the `monorepo` block
# that would handle this declaratively is Pro-only.
#
# GoReleaser only builds the archives and checksums.txt into dist/. The
# workflow (.github/workflows/release-cli.yml) publishes them as the release
# "queenctl X.Y.Z" on the clients/client-cli/vX.Y.Z tag: GoReleaser itself
# would publish on vX.Y.Z, the broker's tag.

before:
  hooks:
    - go mod tidy

builds:
  - id: queenctl
    main: .
    binary: queenctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/smartpricing/queen/clients/client-cli/v2/cmd.BuildVersion={{ .Version }}
      - -X github.com/smartpricing/queen/clients/client-cli/v2/cmd.BuildCommit={{ .ShortCommit }}
      - -X github.com/smartpricing/queen/clients/client-cli/v2/cmd.BuildDate={{ .CommitDate }}

archives:
  - id: queenctl-archive
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE.md
      - README.md
      - completions/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  disable: true

# The release notes come from CHANGELOG.md (see the workflow).
changelog:
  disable: true

git:
  tag_sort: -version:refname
