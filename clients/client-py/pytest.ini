[pytest]
# Pytest configuration for Queen client tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Async support
asyncio_mode = auto
# Keep the *default* fixture loop scope at function so the per-test `client`
# fixture shares the test's function-scoped loop and tears down cleanly (httpx
# aclose() otherwise call_soon()s on an already-closed loop -> ~91 "Event loop
# is closed" teardown errors). The only session-scoped fixtures (db_pool,
# cleanup_test_data) pin loop_scope="session" explicitly on their decorators in
# conftest.py, which is what avoids the pytest-asyncio >=0.24 ScopeMismatch.
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

