# Declines install scripts for esbuild and sharp (they ship prebuilds),
# clearing pnpm's build-scripts gate. Adding a package here lets it run scripts.
packages: []
allowBuilds: # pnpm 11
  esbuild: false
  sharp: false
ignoredBuiltDependencies: # pnpm 10
  - esbuild
  - sharp
# One patch to Nimbus's head component: on the homepage the WebSite JSON-LD
# node is named "Queen MQ" (it carried the page title, which search engines
# read as the site name), and the WebSite and every WebPage's isPartOf carry
# the @id the site-wide graph in astro.config.ts declares. The key is pinned
# to 0.8.2: bumping nimbus-docs fails the install until the patch is redone
# with `pnpm patch @cloudflare/nimbus-docs@<new>` (or dropped, if upstream
# names the WebSite node itself). scripts/check-seo.mjs checks the name.
patchedDependencies:
  '@cloudflare/nimbus-docs@0.8.2': patches/@cloudflare__nimbus-docs@0.8.2.patch
