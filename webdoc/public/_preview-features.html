<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>feature svg preview</title>
    <style>
      body { margin: 0; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      .panel { padding: 28px 24px; }
      .light { background: #fcfcfc; color: #737373; }
      .dark  { background: #020202; color: #737373; }
      .card-dark { background: #0F0F0F; }
      .card-light { background: #ffffff; }
      .row { margin: 0 auto; }
      .w976 { width: 976px; }
      .w780 { width: 780px; }
      .w390 { width: 390px; }
      img { width: 100%; height: auto; display: block; }
      h4 { margin: 0 0 8px; font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="panel light">
      <div class="row w976"><h4>light / 976px</h4><img src="/queen-features.svg" /></div>
    </div>
    <div class="panel dark">
      <div class="row w976"><h4>dark / 976px</h4><img src="/queen-features.svg" /></div>
    </div>
    <div class="panel light">
      <div class="row w780"><h4>light / 780px (README)</h4><img src="/queen-features.svg" /></div>
    </div>
    <div class="panel dark">
      <div class="row w780"><h4>dark / 780px (README)</h4><img src="/queen-features.svg" /></div>
    </div>
    <div class="panel light">
      <div class="row w390"><h4>light / 390px (phone)</h4><img src="/queen-features.svg" /></div>
    </div>
  </body>
</html>
