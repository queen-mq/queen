<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <style>
    .qf-root {
      --ink: #181818;
      --line: #d4d4d4;
      --mut: #737373;
    }
    @media (prefers-color-scheme: dark) {
      .qf-root { --ink: #f5f5f5; --line: #404040; --mut: #a1a1a1; }
    }
    html:not([data-mode="dark"]) .qf-root { --ink: #181818; --line: #d4d4d4; --mut: #737373; }
    html[data-mode="dark"] .qf-root { --ink: #f5f5f5; --line: #404040; --mut: #a1a1a1; }
    .qf-box { fill: none; stroke: var(--line); }
    .qf-t { fill: var(--ink); font: 500 16px ui-sans-serif, system-ui, sans-serif; }
    .qf-m { fill: var(--mut); font: 400 12px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <g class="qf-root">
    <rect class="qf-box" x="8" y="8" width="384" height="104" rx="10" stroke-width="1"/>
    <text class="qf-t" x="24" y="48">theme probe: ink</text>
    <text class="qf-m" x="24" y="76">muted line + muted text</text>
    <rect x="240" y="36" width="130" height="1" fill="var(--line)"/>
  </g>
</svg>
