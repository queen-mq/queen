---
apiVersion: v1
kind: Namespace
metadata:
  name: queen-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: queen-operator
  namespace: queen-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: queen-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: queen-operator
subjects:
  - kind: ServiceAccount
    name: queen-operator
    namespace: queen-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queen-operator
  namespace: queen-system
  labels:
    app.kubernetes.io/name: queen-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queen-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queen-operator
    spec:
      serviceAccountName: queen-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/queen-mq/queen-operator:latest
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
