[package]
name = "queen-seg-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "queen-seg"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
rand = "0.8"
zstd = "0.13"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
