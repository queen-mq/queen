name: docs

# Builds the documentation site in webdoc/ and — more importantly — proves that
# the pages generated from source are not behind that source. The route table,
# the environment-variable reference, the Prometheus family list, the proxy
# route classes and every published code snippet are derived by
# webdoc/scripts/*.mjs, so this job also has to run when the code they read
# changes, not only when a page changes. examples/** is on that list for the
# same reason: every snippet on the tutorial and full-example pages is extracted
# verbatim from a program under it, so editing a program without rebuilding the
# partials is exactly the drift gen:check exists to catch.
#
# On master (a push, or a manual run) the deploy job then publishes the dist/
# this build produced and checked to queenmq.com. It stays off until the
# repository variable CLOUDFLARE_ACCOUNT_ID and the secret CLOUDFLARE_API_TOKEN
# exist, so master is not red while Cloudflare access is being set up.
#
# The mcp job then redeploys the MCP server at queenmq.com/mcp, whose answers
# are cut out of that same build. mcp/** is on the push list for it: a change
# to the server or to its traps goes out as well.
on:
  push:
    paths:
      - "webdoc/**"
      - "mcp/**"
      - "server/src/**"
      - "server/tests/**"
      - "proxy/src/routes.rs"
      - "proxy/src/console.rs"
      - "proxy/src/oauth.rs"
      - "benchmark-queen/**"
      - "clients/client-js/test-v2/**"
      - "clients/client-py/tests/**"
      - "clients/client-go/tests/**"
      - "clients/client-cpp/**"
      - "clients/client-rust/tests/**"
      - "clients/client-php/**"
      - "supervisor/**"
      - "README.md"
      - "CHANGELOG.md"
      - "examples/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "webdoc/**"
      - "server/src/**"
      - "server/tests/**"
      - "proxy/src/routes.rs"
      - "proxy/src/console.rs"
      - "proxy/src/oauth.rs"
      - "benchmark-queen/**"
      - "clients/client-js/test-v2/**"
      - "clients/client-py/tests/**"
      - "clients/client-go/tests/**"
      - "clients/client-cpp/**"
      - "clients/client-rust/tests/**"
      - "clients/client-php/**"
      - "supervisor/**"
      - "README.md"
      - "CHANGELOG.md"
      - "examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# A newer push replaces an older run of the same branch, except on master,
# where the older run may be deploying: master runs queue instead.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webdoc
    steps:
      # sourceOfTruth compares the last commit touching each page and source;
      # a shallow checkout would turn every older path into "not yet in git".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webdoc/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The benchmark figures are rendered from the archived artifacts by
      # scripts/charts.py, so the drift check needs matplotlib present.
      #
      # The version is pinned EXACTLY, not to 3.10.*, because gen-charts.mjs
      # --check re-renders the figures and compares them to the committed SVGs
      # byte for byte. Patch releases change that output: 3.10.* resolved to
      # 3.10.9 on the runner against SVGs rendered with 3.10.6, and every run
      # failed with "DRIFT: webdoc/public/charts is behind the benchmark
      # artifacts" while `pnpm gen:check` passed locally. Bumping this pin means
      # running `pnpm --dir webdoc gen` and committing the re-rendered figures
      # in the same commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install "matplotlib==3.10.6"

      # Fails when a generated table or snippet is behind the Rust/test
      # source it is derived from, and when one of the mirrored Rust
      # classifiers changed (the generators keep a fingerprint of each).
      - name: Generated content is current
        run: pnpm gen:check

      - name: Typecheck
        run: pnpm typecheck

      # Build before lint, not after: the `nimbus/internal-link` rule resolves
      # links against `.nimbus/routes.json`, which Astro materializes at
      # `astro:build:done`. Linting first checks links against a stale route
      # map — or none at all on a clean checkout.
      - name: Build
        run: pnpm build

      - name: Markdown structure
        run: pnpm check:markdown

      # Breadcrumb links, unique titles, sitemap dates, noindex on the source
      # twins, security headers, and every inline script's hash in the CSP:
      # a missing hash blocks the script in the browser and fails nothing else.
      - name: Search surface and headers
        run: pnpm check:seo

      - name: LLM brief
        run: pnpm check:brief

      - name: Lint prose and MDX
        run: pnpm lint:docs

      - name: Prose contract
        run: pnpm check:prose

      - name: Source-of-truth freshness
        run: pnpm check:sourceoftruth

      # Only a build of master that passed every gate above is published.
      - name: Keep the site for the deploy
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: webdoc-dist
          path: webdoc/dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: docs
      url: https://queenmq.com
    # One deploy at a time, whichever run it comes from.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: webdoc
    steps:
      # wrangler.jsonc names the Worker and the assets directory; the site
      # itself comes from the checked build, not from a second build here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: webdoc/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: webdoc-dist
          path: webdoc/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The Worker `queen` serves static assets only; routes are not declared,
      # so the queenmq.com binding set in the dashboard is left untouched.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy
      - name: The site answers
        run: |
          for path in / /guides/laravel/supervisors/; do
            for _ in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://queenmq.com${path}")
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "https://queenmq.com${path} -> ${code}"
            test "$code" = 200
          done

  # The MCP server answers from a bundle that mcp/scripts/build-bundle.mjs cuts
  # out of webdoc/dist, so it goes out with the site. Deployed by hand it
  # trailed: it named the broker version and served the pages of the day
  # somebody last ran the deploy.
  mcp:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One deploy at a time, whichever run it comes from.
    concurrency:
      group: mcp-deploy
      cancel-in-progress: false
    steps:
      # Not a sparse checkout: besides the build, the bundle reads the tested
      # snippets, the example programs, the Kafka compatibility tables and the
      # broker's version, all from the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdoc-dist
          path: webdoc/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Builds the bundle and runs the server's tests against it. A bundle the
      # tests refuse is not deployed, and the server stays on its last one.
      - name: Bundle and test
        run: npm --prefix mcp test
      # mcp/wrangler.jsonc declares the route queenmq.com/mcp*, so the token
      # needs Workers Routes: Edit on the zone beside Workers Scripts: Edit.
      - name: Deploy to Cloudflare
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy
      # The server reports the commit its bundle was cut from, as
      # 2.0.0+docs.<short sha>: it has to be this run's.
      - name: The server answers from this commit
        run: |
          ask='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"docs-ci","version":"0"}}}'
          for _ in 1 2 3 4 5 6; do
            version=$(curl -s -X POST https://queenmq.com/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d "$ask" | jq -r '.result.serverInfo.version // empty' || true)
            commit="${version##*+docs.}"
            if [ -n "$commit" ] && [ "${GITHUB_SHA#"$commit"}" != "$GITHUB_SHA" ]; then break; fi
            sleep 5
          done
          echo "https://queenmq.com/mcp -> ${version}"
          [ -n "$commit" ] && [ "${GITHUB_SHA#"$commit"}" != "$GITHUB_SHA" ]
