name: docs

# Builds the documentation site in webdoc/ and — more importantly — proves that
# the pages generated from source are not behind that source. The route table,
# the environment-variable reference, the Prometheus family list, the proxy
# route classes and every published code snippet are derived by
# webdoc/scripts/*.mjs, so this job also has to run when the code they read
# changes, not only when a page changes.
on:
  push:
    paths:
      - "webdoc/**"
      - "server/src/**"
      - "server/sql/**"
      - "server/tests/**"
      - "proxy/src/routes.rs"
      - "proxy/src/main.rs"
      - "proxy/src/console.rs"
      - "proxy/src/oauth.rs"
      - "benchmark-queen/**"
      - "clients/client-js/test-v2/**"
      - "clients/client-py/tests/**"
      - "clients/client-go/tests/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "webdoc/**"
      - "server/src/**"
      - "server/sql/**"
      - "server/tests/**"
      - "proxy/src/routes.rs"
      - "proxy/src/main.rs"
      - "proxy/src/console.rs"
      - "proxy/src/oauth.rs"
      - "benchmark-queen/**"
      - "clients/client-js/test-v2/**"
      - "clients/client-py/tests/**"
      - "clients/client-go/tests/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webdoc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webdoc/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The benchmark figures are rendered from the archived artifacts by
      # scripts/charts.py, so the drift check needs matplotlib present.
      #
      # The version is pinned EXACTLY, not to 3.10.*, because gen-charts.mjs
      # --check re-renders the figures and compares them to the committed SVGs
      # byte for byte. Patch releases change that output: 3.10.* resolved to
      # 3.10.9 on the runner against SVGs rendered with 3.10.6, and every run
      # failed with "DRIFT: webdoc/public/charts is behind the benchmark
      # artifacts" while `pnpm gen:check` passed locally. Bumping this pin means
      # running `pnpm --dir webdoc gen` and committing the re-rendered figures
      # in the same commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install "matplotlib==3.10.6"

      # Fails when a generated table or snippet is behind the Rust/SQL/test
      # source it is derived from, and when one of the mirrored Rust
      # classifiers changed (the generators keep a fingerprint of each).
      - name: Generated content is current
        run: pnpm gen:check

      # Build before lint, not after: the `nimbus/internal-link` rule resolves
      # links against `.nimbus/routes.json`, which Astro materializes at
      # `astro:build:done`. Linting first checks links against a stale route
      # map — or none at all on a clean checkout.
      - name: Build
        run: pnpm build

      - name: Lint prose and MDX
        run: pnpm lint:docs
