name: tests

# Full client + broker test matrix (JS/Go/Py/CLI/C++ on single + HA stacks,
# plus Rust broker unit tests). This is the CI counterpart of `test/run.sh`.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile the broker once and share it as an artifact so the matrix cells load
  # it instead of recompiling Rust six times.
  broker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build queen:test
        uses: docker/build-push-action@v6
        with:
          # Repo root, not ./server: the broker depends on the shared
          # queen-protocol crate by relative path, so it has to be in context.
          context: .
          file: ./server/Dockerfile
          tags: queen:test
          outputs: type=docker,dest=/tmp/queen-test.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: queen-test-image
          path: /tmp/queen-test.tar
          retention-days: 1

  # One cell per suite; each runs its applicable topologies via test/run.sh.
  suites:
    needs: broker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `http` is the kv/timer wire with no SDK in the way (PLAN_KV_TIMERS.md
        # §10.2). It is a cell of its own rather than a step of another because
        # it is the executable specification the six SDK cells are read against:
        # when it and an SDK cell disagree, the SDK is wrong.
        suite: [js, go, py, cli, cpp, laravel, rust-client, mesh, http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: queen-test-image
          path: /tmp
      - run: docker load -i /tmp/queen-test.tar
      - name: ${{ matrix.suite }}
        run: test/run.sh --suite ${{ matrix.suite }} --no-build-broker -j 1

  # Pure PHP/Laravel client contract tests. Keep this independent from the
  # broker image so syntax, dependency and fake-handler regressions fail fast
  # even when Docker or the live Laravel matrix is unavailable.
  php-client-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4"]
    defaults:
      run:
        working-directory: clients/client-laravel
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pcntl, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Resolve and install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit resolved dependencies
        if: matrix.php-version == '8.4'
        run: composer audit --locked --no-interaction
      - name: PHPUnit unit suite
        run: vendor/bin/phpunit --testsuite Unit

  # Broker tests that do not require the live PostgreSQL stack. Native for fast
  # caching; live integration cases remain in the Docker-backed matrix above.
  rust-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo test
        run: cargo test --manifest-path server/Cargo.toml --locked

  # The Rust SDK, Laravel supervisor and wire-contract crate. There is no cargo workspace at the
  # repo root, and a path dependency's `#[cfg(test)]` modules are never compiled
  # — so the broker's `cargo test` above reaches neither of these. Each manifest
  # has to be named explicitly or its tests do not run anywhere.
  #
  # No broker here: this cell is the unit tests, the fake-broker wire tests and
  # the skip branch of the integration harness. The live-broker run is the
  # `rust-client` cell of the matrix above. The supervisor uses mocked/local
  # inputs only, so its complete suite belongs here.
  rust-client-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: queen-protocol tests
        run: cargo test --manifest-path crates/queen-protocol/Cargo.toml --locked
      - name: client tests
        run: cargo test --manifest-path clients/client-rust/Cargo.toml --locked
      - name: Laravel supervisor tests
        run: cargo test --manifest-path supervisor/Cargo.toml --locked
      # `signals` is off by default, so nothing else in the repo ever compiles
      # `shutdown_on_signal`.
      - name: client tests (all features)
        run: cargo test --manifest-path clients/client-rust/Cargo.toml --locked --all-features
      - name: rustfmt
        run: |
          cargo fmt --manifest-path crates/queen-protocol/Cargo.toml --check
          cargo fmt --manifest-path clients/client-rust/Cargo.toml --check
          cargo fmt --manifest-path supervisor/Cargo.toml --check
      - name: clippy
        run: |
          cargo clippy --manifest-path crates/queen-protocol/Cargo.toml --locked \
            --all-targets -- -D warnings
          cargo clippy --manifest-path clients/client-rust/Cargo.toml --locked \
            --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path supervisor/Cargo.toml --locked \
            --all-targets -- -D warnings

  # `rust-version` in the client's Cargo.toml is a promise to anyone on an older
  # toolchain. Every other job runs current stable, so without this the promise
  # is never checked — which is how it came to say 1.75 while the crate had not
  # built on anything below 1.86 for a long time. Keep the number here and in
  # Cargo.toml in step.
  rust-client-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86"
      - name: cargo check on the declared MSRV
        run: |
          cargo check --manifest-path crates/queen-protocol/Cargo.toml --locked --all-targets
          cargo check --manifest-path clients/client-rust/Cargo.toml --locked \
            --all-targets --all-features

  # The supervisor's HTTP/TLS dependency tree requires Rust 1.88 (ICU 2.3).
  # Keep this separate from the SDK's lower 1.86 promise.
  supervisor-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
      - name: cargo check on the declared MSRV
        run: cargo check --manifest-path supervisor/Cargo.toml --locked --all-targets

  # Same promise for the broker crate (queen-engine), which declares its own,
  # HIGHER floor: 1.88, forced by jsonwebtoken -> simple_asn1 -> time. The two
  # pins are intentionally different — the client's tree stops at 1.86. This job
  # also proves the embedders' shape compiles: default-features = false must
  # keep building (with the bin skipped via required-features), or the published
  # library breaks for every consumer while every other job, which builds the
  # full server, stays green.
  server-msrv-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
      - name: cargo check on the declared MSRV, full and lean
        run: |
          cargo check --manifest-path server/Cargo.toml --locked --all-targets
          cargo check --manifest-path server/Cargo.toml --locked \
            --all-targets --no-default-features
