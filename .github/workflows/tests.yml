name: tests

# Full client + broker test matrix (JS/Go/Py/CLI/C++ on single + HA stacks,
# plus Rust broker unit tests). This is the CI counterpart of `test/run.sh`.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile the broker once and share it as an artifact so the matrix cells load
  # it instead of recompiling Rust six times.
  broker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build queen:test
        uses: docker/build-push-action@v6
        with:
          # Repo root, not ./server: the broker depends on the shared
          # queen-protocol crate by relative path, so it has to be in context.
          context: .
          file: ./server/Dockerfile
          tags: queen:test
          outputs: type=docker,dest=/tmp/queen-test.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: queen-test-image
          path: /tmp/queen-test.tar
          retention-days: 1

  # One cell per suite; each runs its applicable topologies via test/run.sh.
  suites:
    needs: broker-image
    runs-on: ubuntu-latest
    # JS and CLI each exercise three isolated topologies. Their per-topology
    # safety deadline is about ten minutes, so a serialized lane needs more
    # than thirty minutes including image setup and teardown.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `http` is the kv/timer wire with no SDK in the way (PLAN_KV_TIMERS.md
        # §10.2). It is a cell of its own rather than a step of another because
        # it is the executable specification the six SDK cells are read against:
        # when it and an SDK cell disagree, the SDK is wrong.
        suite: [js, go, py, cli, cpp, laravel, rust-client, mesh, http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: queen-test-image
          path: /tmp
      - run: docker load -i /tmp/queen-test.tar
      - name: ${{ matrix.suite }}
        run: test/run.sh --suite ${{ matrix.suite }} --no-build-broker -j 1

  # Pure PHP/Laravel client contract tests. Keep this independent from the
  # broker image so syntax, dependency and fake-handler regressions fail fast
  # even when Docker or the live Laravel matrix is unavailable.
  php-client-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4"]
    defaults:
      run:
        working-directory: clients/client-php
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pcntl, posix, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Resolve and install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit resolved dependencies
        if: matrix.php-version == '8.4'
        run: composer audit --locked --no-interaction
      - name: PHPUnit unit suite
        run: vendor/bin/phpunit --testsuite Unit
      - name: Supervisor release/installer contract
        if: matrix.php-version == '8.3'
        working-directory: ${{ github.workspace }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("supervisor/Cargo.toml", "rb"))["package"]["version"])')
          python3 supervisor/scripts/verify_release_version.py --tag "supervisor/v$version"
          release_test=$(mktemp -d)
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            touch "$release_test/queen-supervisor-$version-$platform.tar.gz"
          done
          python3 supervisor/scripts/build_release_manifest.py \
            --version "$version" \
            --repository queen-mq/queen \
            --source-commit "$(git rev-parse HEAD)" \
            --dist "$release_test" \
            --output "$release_test/queen-supervisor-manifest.json"
          php supervisor/scripts/verify_client_manifest.php \
            "$release_test/queen-supervisor-manifest.json"
          python3 -m unittest discover -s supervisor/scripts/tests -v

  # `WithoutOverlapping` uses Laravel's cache rather than the Queen broker.
  # Keep its real Redis + process-crash proof visible and isolated from both
  # the offline unit lane and the performance fixtures.
  php-client-redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    defaults:
      run:
        working-directory: clients/client-php
    env:
      QUEEN_LARAVEL_TEST_REDIS_HOST: 127.0.0.1
      QUEEN_LARAVEL_TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pcntl, posix, redis, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Resolve and install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Redis-backed Laravel overlap integration
        run: vendor/bin/phpunit --testsuite RedisIntegration --testdox

  # The qualification harness is executable test infrastructure: a parser or
  # fault-gate regression can make a green product look safe or a fast lane
  # look comparable when it is not. Keep its offline contract tests and static
  # shell checks in CI independently of long-running Docker campaigns.
  laravel-supervisor-harness-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmark-queen/laravel-supervisors
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Python lint tooling
        run: python3 -m pip install --disable-pip-version-check "ruff==0.15.4"
      - name: Harness unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Python lint contract
        run: ruff check scripts
      - name: Shell syntax and static analysis
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
      - name: PHP fixture syntax
        run: find app/app app/config app/tests -name '*.php' -print0 | xargs -0 -n1 php -l

  # Broker tests that do not require the live PostgreSQL stack. Native for fast
  # caching; live integration cases remain in the Docker-backed matrix above.
  rust-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No Cargo.toml at the repo root, so the bundled rust-cache's default
          # workspace (the checkout dir) makes its `cargo metadata` probe die
          # with exit 101. That is non-fatal — it only leaves the job with an
          # empty cache key, so every run recompiles from scratch — but it
          # prints a red `Error:` into a green job, which is exactly the noise
          # that hides a real one. Name the manifests instead.
          cache-workspaces: server
      - name: cargo test
        run: cargo test --manifest-path server/Cargo.toml --locked

  # The Rust SDK, Laravel supervisor and wire-contract crate. There is no cargo workspace at the
  # repo root, and a path dependency's `#[cfg(test)]` modules are never compiled
  # — so the broker's `cargo test` above reaches neither of these. Each manifest
  # has to be named explicitly or its tests do not run anywhere.
  #
  # No broker here: this cell is the unit tests, the fake-broker wire tests and
  # the skip branch of the integration harness. The live-broker run is the
  # `rust-client` cell of the matrix above. The supervisor uses mocked/local
  # inputs only, so its complete suite belongs here.
  rust-client-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          # See rust-unit: both manifests, or rust-cache probes the root.
          cache-workspaces: |
            crates/queen-protocol
            clients/client-rust
      - name: queen-protocol tests
        run: cargo test --manifest-path crates/queen-protocol/Cargo.toml --locked
      - name: client tests
        run: cargo test --manifest-path clients/client-rust/Cargo.toml --locked
      - name: Laravel supervisor tests
        run: cargo test --manifest-path supervisor/Cargo.toml --locked
      # `signals` is off by default, so nothing else in the repo ever compiles
      # `shutdown_on_signal`.
      - name: client tests (all features)
        run: cargo test --manifest-path clients/client-rust/Cargo.toml --locked --all-features
      # Both crates every run. Under `bash -e` the first failure aborted the
      # step, so a diff in queen-protocol hid every diff in client-rust and the
      # log named only half of what had to be fixed.
      - name: rustfmt
        run: |
          rc=0
          cargo fmt --manifest-path crates/queen-protocol/Cargo.toml --check || rc=1
          cargo fmt --manifest-path clients/client-rust/Cargo.toml --check || rc=1
          cargo fmt --manifest-path supervisor/Cargo.toml --check || rc=1
          exit $rc
      - name: clippy
        run: |
          rc=0
          cargo clippy --manifest-path crates/queen-protocol/Cargo.toml --locked \
            --all-targets -- -D warnings || rc=1
          cargo clippy --manifest-path clients/client-rust/Cargo.toml --locked \
            --all-targets --all-features -- -D warnings || rc=1
          cargo clippy --manifest-path supervisor/Cargo.toml --locked \
            --all-targets -- -D warnings || rc=1
          exit $rc

  # The Kafka wire-protocol facade (PLAN_QUEEN_KAFKA.md). Its own workspace root,
  # excluded from every other manifest by construction — which is exactly why it
  # needs a cell of its own: named nowhere, its tests, rustfmt and clippy would
  # run nowhere, and every correctness claim in the crate would rest on a suite
  # CI never executes.
  #
  # Unit tests only. The `protocols/queen-kafka/compat/` lane (kcat/kafkajs/franz-go
  # against a live stack) joins test/run.sh at M6 and stays OUT of this workflow
  # until it is boring — the proxyimpr lesson: a flaky new lane in the release-day
  # matrix is discovered on release day.
  kafka-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          # See rust-unit: name the manifest, or rust-cache probes the root.
          cache-workspaces: protocols/queen-kafka
      - name: cargo test
        # Built first, then run with the address space capped. A decoder that
        # preallocates on a length a client chose is invisible wherever the
        # kernel overcommits -- a developer's macOS, Docker's VM -- and shows up
        # only as a SIGABRT on a host that refuses the reservation. The cap
        # makes that failure deterministic here rather than a function of how
        # much memory this runner happens to have.
        run: |
          cargo test --manifest-path protocols/queen-kafka/Cargo.toml --locked --no-run
          ( ulimit -v 8388608
            cargo test --manifest-path protocols/queen-kafka/Cargo.toml --locked )
      - name: rustfmt
        run: cargo fmt --manifest-path protocols/queen-kafka/Cargo.toml --check
      - name: clippy
        run: |
          cargo clippy --manifest-path protocols/queen-kafka/Cargo.toml --locked \
            --all-targets -- -D warnings

  # `rust-version` in the client's Cargo.toml is a promise to anyone on an older
  # toolchain. Every other job runs current stable, so without this the promise
  # is never checked — which is how it came to say 1.75 while the crate had not
  # built on anything below 1.86 for a long time. Keep the number here and in
  # Cargo.toml in step.
  rust-client-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86"
          cache-workspaces: |
            crates/queen-protocol
            clients/client-rust
      - name: cargo check on the declared MSRV
        run: |
          cargo check --manifest-path crates/queen-protocol/Cargo.toml --locked --all-targets
          cargo check --manifest-path clients/client-rust/Cargo.toml --locked \
            --all-targets --all-features

  # The supervisor's HTTP/TLS dependency tree requires Rust 1.88 (ICU 2.3).
  # Keep this separate from the SDK's lower 1.86 promise.
  supervisor-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
      - name: cargo check on the declared MSRV
        run: cargo check --manifest-path supervisor/Cargo.toml --locked --all-targets

  # Same promise for the broker crate (queen-engine), which declares its own,
  # HIGHER floor: 1.88, forced by jsonwebtoken -> simple_asn1 -> time. The two
  # pins are intentionally different — the client's tree stops at 1.86. This job
  # also proves the embedders' shape compiles: default-features = false must
  # keep building (with the bin skipped via required-features), or the published
  # library breaks for every consumer while every other job, which builds the
  # full server, stays green.
  server-msrv-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          cache-workspaces: server
      - name: cargo check on the declared MSRV, full and lean
        run: |
          cargo check --manifest-path server/Cargo.toml --locked --all-targets
          cargo check --manifest-path server/Cargo.toml --locked \
            --all-targets --no-default-features
