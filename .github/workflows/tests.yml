name: tests

# Full client + broker test matrix (JS/Go/Py/CLI/C++ on single + HA stacks,
# plus Rust broker unit tests). This is the CI counterpart of `test/run.sh`.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile the broker once and share it as an artifact so the matrix cells load
  # it instead of recompiling Rust six times.
  broker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build queen:test
        uses: docker/build-push-action@v6
        with:
          # Repo root, not ./server: the broker depends on the shared
          # queen-protocol crate by relative path, so it has to be in context.
          context: .
          file: ./server/Dockerfile
          tags: queen:test
          outputs: type=docker,dest=/tmp/queen-test.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: queen-test-image
          path: /tmp/queen-test.tar
          retention-days: 1

  # One cell per suite; each runs its applicable topologies via test/run.sh.
  suites:
    needs: broker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [js, go, py, cli, cpp, rust-client, mesh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: queen-test-image
          path: /tmp
      - run: docker load -i /tmp/queen-test.tar
      - name: ${{ matrix.suite }}
        run: test/run.sh --suite ${{ matrix.suite }} --no-build-broker -j 1

  # 50 in-process broker unit tests — no stack needed. Native for fast caching;
  # this is the Rust CI the repo previously lacked.
  rust-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo test
        run: cargo test --manifest-path server/Cargo.toml --locked

  # The Rust SDK and the wire-contract crate. There is no cargo workspace at the
  # repo root, and a path dependency's `#[cfg(test)]` modules are never compiled
  # — so the broker's `cargo test` above reaches neither of these. Each manifest
  # has to be named explicitly or its tests do not run anywhere.
  #
  # No broker here: this cell is the unit tests, the fake-broker wire tests and
  # the skip branch of the integration harness. The live-broker run is the
  # `rust-client` cell of the matrix above.
  rust-client-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: queen-protocol tests
        run: cargo test --manifest-path crates/queen-protocol/Cargo.toml --locked
      - name: client tests
        run: cargo test --manifest-path clients/client-rust/Cargo.toml --locked
      # `signals` is off by default, so nothing else in the repo ever compiles
      # `shutdown_on_signal`.
      - name: client tests (all features)
        run: cargo test --manifest-path clients/client-rust/Cargo.toml --locked --all-features
      - name: rustfmt
        run: |
          cargo fmt --manifest-path crates/queen-protocol/Cargo.toml --check
          cargo fmt --manifest-path clients/client-rust/Cargo.toml --check
      - name: clippy
        run: |
          cargo clippy --manifest-path crates/queen-protocol/Cargo.toml --locked \
            --all-targets -- -D warnings
          cargo clippy --manifest-path clients/client-rust/Cargo.toml --locked \
            --all-targets --all-features -- -D warnings

  # `rust-version` in the client's Cargo.toml is a promise to anyone on an older
  # toolchain. Every other job runs current stable, so without this the promise
  # is never checked — which is how it came to say 1.75 while the crate had not
  # built on anything below 1.86 for a long time. Keep the number here and in
  # Cargo.toml in step.
  rust-client-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.86"
      - name: cargo check on the declared MSRV
        run: |
          cargo check --manifest-path crates/queen-protocol/Cargo.toml --locked --all-targets
          cargo check --manifest-path clients/client-rust/Cargo.toml --locked \
            --all-targets --all-features
