name: Docker Images

# Publishes both images to GHCR under the repo's own org:
#   ghcr.io/queen-mq/queen         (broker + dashboard + queenctl)
#   ghcr.io/queen-mq/queen-proxy   (gateway + operator console)
#
# Auth is the workflow's own GITHUB_TOKEN — no registry secrets to rotate. The
# `packages: write` permission below is what makes that token able to push.
#
# A package is PRIVATE the first time it is published. Flip it once by hand at
# https://github.com/orgs/queen-mq/packages -> package -> Package settings.
#
# Docker Hub is a MIRROR of the same build, not a second build: buildx pushes
# one manifest to every tag listed below, so the images are bit-identical
# across the two registries. It is opt-in and stays off until both exist:
#
#   vars.DOCKERHUB_NAMESPACE        the Docker Hub account/org that owns the
#                                   repos, e.g. `queenmq` -> queenmq/queen.
#                                   Falls back to the C++-era DOCKER_REGISTRY
#                                   secret (with any `docker.io/` prefix
#                                   stripped) so nothing breaks if it is unset.
#   secrets.DOCKER_USERNAME         Docker ID
#   secrets.DOCKER_PASSWORD         Docker Hub access token (Read & Write)
#
# Without them the job still builds and still publishes to GHCR — which is what
# keeps pull requests and forks green.

on:
  push:
    branches: [ "release" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:

# One run per ref: a tag push landing on top of a branch push should supersede
# it rather than race it to the same tags.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # One image failing should not cancel the other's build.
      fail-fast: false
      matrix:
        include:
          - image: queen
            dockerfile: ./Dockerfile
          - image: queen-proxy
            dockerfile: ./proxy/Dockerfile

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The two images version independently: the broker from server.json (the
    # same file build.rs reads), the proxy from its own crate manifest. Forcing
    # a shared number would mean bumping one of them for no reason.
    - name: Resolve version, commit and tags
      id: meta
      env:
        # A namespace is not a secret, so it lives in a repo VARIABLE and the
        # tag list below stays readable in the log. Read through the fallback
        # instead and Actions masks it: every tag prints as ***/queen:1.0.3.
        HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        HUB_NAMESPACE_FALLBACK: ${{ secrets.DOCKER_REGISTRY }}
        HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IS_PR: ${{ github.event_name == 'pull_request' }}
      run: |
        case "${{ matrix.image }}" in
          queen)
            VERSION=$(jq -r '.version' server/server.json)
            ;;
          queen-proxy)
            VERSION=$(awk -F'"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' \
              proxy/Cargo.toml)
            ;;
        esac
        test -n "$VERSION" || { echo "could not resolve version for ${{ matrix.image }}"; exit 1; }
        SHA=$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "sha=$SHA" >> $GITHUB_OUTPUT

        # The C++ workflow stored the namespace as `docker.io/<ns>` and passed
        # that whole string to docker login, which worked only because the CLI
        # strips the path off a server address. Strip it here instead, so the
        # value means one thing.
        HUB_NS="$HUB_NAMESPACE"
        if [ -z "$HUB_NS" ]; then
          HUB_NS="${HUB_NAMESPACE_FALLBACK#docker.io/}"
        fi

        # Mirroring needs a namespace AND a login, and a pull request has no
        # access to either — secrets are not exposed to forked PRs.
        DOCKERHUB=false
        if [ -n "$HUB_NS" ] && [ -n "$HUB_USERNAME" ] && [ "$IS_PR" != "true" ]; then
          DOCKERHUB=true
        fi
        echo "dockerhub=$DOCKERHUB" >> $GITHUB_OUTPUT

        REGISTRIES="ghcr.io/${{ github.repository_owner }}"
        if [ "$DOCKERHUB" = true ]; then
          REGISTRIES="$REGISTRIES docker.io/$HUB_NS"
        fi

        {
          echo "tags<<TAGS_EOF"
          for reg in $REGISTRIES; do
            echo "$reg/${{ matrix.image }}:$VERSION"
            echo "$reg/${{ matrix.image }}:sha-$SHA"
            echo "$reg/${{ matrix.image }}:latest"
          done
          echo "TAGS_EOF"
        } >> $GITHUB_OUTPUT

        echo "Building ${{ matrix.image }}:$VERSION (docker hub mirror: $DOCKERHUB)"

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No `registry:` here — the action defaults to docker.io, which is the only
    # value that authenticates a Docker Hub push.
    - name: Log in to Docker Hub
      if: steps.meta.outputs.dockerhub == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        # Both Dockerfiles build from the repo root — the proxy crate embeds
        # ../server/webapp/dist, which is outside proxy/.
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        # GHCR always, Docker Hub when the mirror is configured. One build, one
        # manifest, pushed to every tag in the list.
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.licenses=Apache-2.0
        # Ignored by the proxy Dockerfile, which declares no ARGs; only the
        # broker stamps them into queenctl so that `queenctl version` inside the
        # container matches the tag the image was published under.
        build-args: |
          QUEENCTL_VERSION=${{ steps.meta.outputs.version }}
          QUEENCTL_COMMIT=${{ steps.meta.outputs.sha }}
        # Scoped per image: a shared gha cache key would make the two matrix
        # legs evict each other's layers and cold-build every run.
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,scope=${{ matrix.image }},mode=max

    - name: Summary
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        {
          echo "### ${{ matrix.image }}"
          echo ""
          echo '```'
          echo "$TAGS"
          echo '```'
          echo ""
          echo "- platforms: linux/amd64, linux/arm64"
          echo "- revision: ${{ steps.meta.outputs.sha }}"
          echo "- pushed: ${{ github.event_name != 'pull_request' }}"
          echo "- docker hub mirror: ${{ steps.meta.outputs.dockerhub }}"
        } >> $GITHUB_STEP_SUMMARY
