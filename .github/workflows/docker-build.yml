name: Docker Images

# Publishes the image to GHCR under the repo's own org:
#   ghcr.io/queen-mq/queen         (the single binary — broker, embedded proxy +
#                                   operator console, Kafka facade, dashboard —
#                                   plus queenctl)
#
# Auth is the workflow's own GITHUB_TOKEN — no registry secrets to rotate. The
# `packages: write` permission below is what makes that token able to push.
#
# A package is PRIVATE the first time it is published. Flip it once by hand at
# https://github.com/orgs/queen-mq/packages -> package -> Package settings.
#
# Docker Hub is a MIRROR of the same build, not a second build: the `publish`
# job pushes one manifest to every tag listed below, so the images are
# bit-identical across the two registries. It is opt-in and stays off until both
# exist:
#
#   vars.DOCKERHUB_NAMESPACE        the Docker Hub account/org that owns the
#                                   repos, e.g. `queenmq` -> queenmq/queen.
#                                   Falls back to the C++-era DOCKER_REGISTRY
#                                   secret (with any `docker.io/` prefix
#                                   stripped) so nothing breaks if it is unset.
#   secrets.DOCKER_USERNAME         Docker ID
#   secrets.DOCKER_PASSWORD         Docker Hub access token (Read & Write)
#
# Without them the workflow still builds and still publishes to GHCR — which is
# what keeps pull requests and forks green.

on:
  push:
    branches: [ "release" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:

# One run per ref: a tag push landing on top of a branch push should supersede
# it rather than race it to the same tags.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where both platforms are pushed by digest, and what `publish` tags.
  IMAGE: ghcr.io/${{ github.repository_owner }}/queen

jobs:
  # One job per platform, each on a runner of that architecture. On one amd64
  # runner the arm64 half was the whole Rust release build under QEMU: 100 to
  # 150 minutes a run. Native, it costs what the amd64 half costs.
  #
  # A job pushes its image by digest only, under no tag. `publish` below names
  # both with the tags, and it runs only when both jobs succeeded, so a tag
  # never points at one platform alone.
  build:
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    outputs:
      # Each job writes the one named after its own architecture.
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The image is versioned from server.json (the same file build.rs reads).
    - name: Resolve version and commit
      id: meta
      run: |
        VERSION=$(jq -r '.version' server/server.json)
        test -n "$VERSION" || { echo "could not resolve version for queen"; exit 1; }
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v5
      with:
        # The repo root: the broker links the proxy, the Kafka facade and
        # queen-protocol by relative path.
        context: .
        file: ./Dockerfile
        platforms: linux/${{ matrix.arch }}
        # A pull request builds and pushes nothing.
        outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.licenses=Apache-2.0
        # Stamped into queenctl so that `queenctl version` inside the container
        # matches the tag the image is published under.
        build-args: |
          QUEENCTL_VERSION=${{ steps.meta.outputs.version }}
          QUEENCTL_COMMIT=${{ steps.meta.outputs.sha }}
        # Scoped per image and platform, so neither platform (nor a future
        # second image) can evict the other's layers. The unscoped second
        # source is the cache of tests.yml, which builds this Dockerfile for
        # amd64 on every push: a commit it has already built is not compiled
        # again here.
        cache-from: |
          type=gha,scope=queen-${{ matrix.arch }}
          type=gha
        cache-to: type=gha,scope=queen-${{ matrix.arch }},mode=max

    - name: Hand the digest to the publish job
      id: digest
      if: github.event_name != 'pull_request'
      run: echo "${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  # One manifest over the two platform images, pushed to every tag: GHCR
  # always, Docker Hub when the mirror is configured.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Resolve version, commit and tags
      id: meta
      env:
        # A namespace is not a secret, so it lives in a repo VARIABLE and the
        # tag list below stays readable in the log. Read through the fallback
        # instead and Actions masks it: every tag prints as ***/queen:1.0.3.
        HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        HUB_NAMESPACE_FALLBACK: ${{ secrets.DOCKER_REGISTRY }}
        HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        VERSION=$(jq -r '.version' server/server.json)
        test -n "$VERSION" || { echo "could not resolve version for queen"; exit 1; }
        SHA=$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "sha=$SHA" >> $GITHUB_OUTPUT

        # The C++ workflow stored the namespace as `docker.io/<ns>` and passed
        # that whole string to docker login, which worked only because the CLI
        # strips the path off a server address. Strip it here instead, so the
        # value means one thing.
        HUB_NS="$HUB_NAMESPACE"
        if [ -z "$HUB_NS" ]; then
          HUB_NS="${HUB_NAMESPACE_FALLBACK#docker.io/}"
        fi

        # Mirroring needs a namespace AND a login.
        DOCKERHUB=false
        if [ -n "$HUB_NS" ] && [ -n "$HUB_USERNAME" ]; then
          DOCKERHUB=true
        fi
        echo "dockerhub=$DOCKERHUB" >> $GITHUB_OUTPUT

        REGISTRIES="ghcr.io/${{ github.repository_owner }}"
        if [ "$DOCKERHUB" = true ]; then
          REGISTRIES="$REGISTRIES docker.io/$HUB_NS"
        fi

        {
          echo "tags<<TAGS_EOF"
          for reg in $REGISTRIES; do
            echo "$reg/queen:$VERSION"
            echo "$reg/queen:sha-$SHA"
            echo "$reg/queen:latest"
          done
          echo "TAGS_EOF"
        } >> $GITHUB_OUTPUT

        echo "Publishing queen:$VERSION (docker hub mirror: $DOCKERHUB)"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No `registry:` here — the action defaults to docker.io, which is the only
    # value that authenticates a Docker Hub push.
    - name: Log in to Docker Hub
      if: steps.meta.outputs.dockerhub == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Both sources are on GHCR; for a Docker Hub tag imagetools copies them
    # over, so the mirror holds the same two images under the same manifest.
    - name: Publish one manifest for both platforms
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        AMD64: ${{ needs.build.outputs.amd64 }}
        ARM64: ${{ needs.build.outputs.arm64 }}
      run: |
        test -n "$AMD64" || { echo "no digest from the amd64 build"; exit 1; }
        test -n "$ARM64" || { echo "no digest from the arm64 build"; exit 1; }

        args=()
        while IFS= read -r tag; do
          if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
        done <<< "$TAGS"

        docker buildx imagetools create "${args[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
        docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

    - name: Summary
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        {
          echo "### queen"
          echo ""
          echo '```'
          echo "$TAGS"
          echo '```'
          echo ""
          echo "- platforms: linux/amd64, linux/arm64"
          echo "- revision: ${{ steps.meta.outputs.sha }}"
          echo "- docker hub mirror: ${{ steps.meta.outputs.dockerhub }}"
        } >> $GITHUB_STEP_SUMMARY
