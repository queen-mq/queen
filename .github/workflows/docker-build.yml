name: Docker Images

# Publishes both images to GHCR under the repo's own org:
#   ghcr.io/queen-mq/queen         (broker + dashboard + queenctl)
#   ghcr.io/queen-mq/queen-proxy   (gateway + operator console)
#
# Auth is the workflow's own GITHUB_TOKEN — no registry secrets to rotate. The
# `packages: write` permission below is what makes that token able to push.
#
# A package is PRIVATE the first time it is published. Flip it once by hand at
# https://github.com/orgs/queen-mq/packages -> package -> Package settings.

on:
  push:
    branches: [ "release" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:

# One run per ref: a tag push landing on top of a branch push should supersede
# it rather than race it to the same tags.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # One image failing should not cancel the other's build.
      fail-fast: false
      matrix:
        include:
          - image: queen
            dockerfile: ./Dockerfile
          - image: queen-proxy
            dockerfile: ./proxy/Dockerfile

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The two images version independently: the broker from server.json (the
    # same file build.rs reads), the proxy from its own crate manifest. Forcing
    # a shared number would mean bumping one of them for no reason.
    - name: Resolve version and commit
      id: meta
      run: |
        case "${{ matrix.image }}" in
          queen)
            VERSION=$(jq -r '.version' server/server.json)
            ;;
          queen-proxy)
            VERSION=$(awk -F'"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' \
              proxy/Cargo.toml)
            ;;
        esac
        test -n "$VERSION" || { echo "could not resolve version for ${{ matrix.image }}"; exit 1; }
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "Building ${{ matrix.image }}:$VERSION"

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        # Both Dockerfiles build from the repo root — the proxy crate embeds
        # ../server/webapp/dist, which is outside proxy/.
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ steps.meta.outputs.sha }}
          ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.licenses=Apache-2.0
        # Ignored by the proxy Dockerfile, which declares no ARGs; only the
        # broker stamps them into queenctl so that `queenctl version` inside the
        # container matches the tag the image was published under.
        build-args: |
          QUEENCTL_VERSION=${{ steps.meta.outputs.version }}
          QUEENCTL_COMMIT=${{ steps.meta.outputs.sha }}
        # Scoped per image: a shared gha cache key would make the two matrix
        # legs evict each other's layers and cold-build every run.
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,scope=${{ matrix.image }},mode=max

    - name: Summary
      run: |
        {
          echo "### ${{ matrix.image }}"
          echo ""
          echo '```'
          echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}"
          echo '```'
          echo ""
          echo "- platforms: linux/amd64, linux/arm64"
          echo "- revision: ${{ steps.meta.outputs.sha }}"
          echo "- pushed: ${{ github.event_name != 'pull_request' }}"
        } >> $GITHUB_STEP_SUMMARY
