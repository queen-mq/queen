[package]
name = "queen-s3"
version = "1.5.0"
edition = "2021"
# Same floor as server/Cargo.toml: this binary ships in the same image and CI cache.
rust-version = "1.88"
description = "S3 / data-lake sink connector for QueenMQ: reads the log through POST /api/v1/fetch and writes open-format objects (JSONL, Parquet) under a Hive layout, exactly once, at any partition cardinality."
license = "Apache-2.0"
homepage = "https://queenmq.com"
repository = "https://github.com/queen-mq/queen"
publish = false

[lib]
name = "queen_s3"
path = "src/lib.rs"

[[bin]]
name = "queen-s3"
path = "src/main.rs"

# Every dependency the whole connector needs is declared HERE, at the skeleton,
# deliberately (the queen-sqs precedent): the modules are written in parallel and
# a manifest that grows one line per module is a manifest several people edit at
# once. Nothing here is speculative — each entry names the module that uses it.
[dependencies]
# Same pin and feature set as server/, proxy/ and the two facades, so the five
# binaries share one tokio build in a CI cache.
tokio = { version = "1", features = ["full"] }
# The HTTP client, for BOTH sides: the Queen API (src/queen.rs) and the S3 API
# (src/s3/client.rs). Same crate, features and rationale as
# protocols/queen-kafka/Cargo.toml: rustls with the `ring` provider, no OpenSSL on
# the host, no cmake in the build. This is a CLIENT of the broker, exactly like
# the SDK — the broker's own "no reqwest" rule is a broker rule.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
] }
# The health/metrics listener (src/health.rs): /healthz and /metrics only. Same
# major as the broker, the proxy and queen-sqs.
axum = "0.7"
serde = { version = "1", features = ["derive"] }
# `raw_value`: a payload is spliced through untouched (src/types.rs `Record`,
# src/writer/jsonl.rs). Parsing it into a tree would be the loader-CPU trap the
# 1M msg/s campaign hit.
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
# Object compression (src/writer/jsonl.rs, src/checkpoint.rs) — the crate the
# whole repository pins for segment blobs.
zstd = "0.13"
# gzip for readers that do not take zstd JSON (src/writer/jsonl.rs).
flate2 = "1"
# SigV4 (src/s3/sigv4.rs): HMAC-SHA256 key derivation and hashes — the same two
# crates queen-sqs verifies with.
hmac = "0.12"
sha2 = "0.10"
# Content-MD5 on single PUTs and ETag verification (src/s3/client.rs).
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
# Parquet writer (src/writer/parquet.rs). NO default features: `arrow` is not
# needed for a fixed five-column envelope written through the low-level
# SerializedFileWriter API, and its tree is the whole cost. `zstd` resolves to
# the same zstd crate as above; `snap` is pure Rust. rust-version 1.85 (verified
# against the registry, 2026-09-04).
parquet = { version = "59", default-features = false, features = ["zstd", "snap"] }
# Backoff jitter and incarnation ids (src/s3/client.rs, src/lease.rs).
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
# `tokio::time::pause`/`advance` for the driver tests; the binary never gets
# test-util (Cargo unifies features per build, the queen-kafka precedent).
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
