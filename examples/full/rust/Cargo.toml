[package]
name = "queen-full-examples"
version = "0.0.0"
edition = "2021"
publish = false

# The client comes from this repository, not from crates.io, so the examples
# always exercise the code in the tree they ship with.
[dependencies]
queen-mq = { path = "../../../clients/client-rust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"

[[bin]]
name = "produce-consume"
path = "src/bin/01_produce_consume.rs"

[[bin]]
name = "ordering-and-dedup"
path = "src/bin/02_ordering_and_dedup.rs"

[[bin]]
name = "pipeline-transaction"
path = "src/bin/03_pipeline_transaction.rs"
