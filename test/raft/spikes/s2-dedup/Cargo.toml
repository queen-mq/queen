[package]
name = "s2-dedup"
version = "0.1.0"
edition = "2021"
# Same floor as server/Cargo.toml (C-3), same engine pins as s1-store: those are
# the newest releases of each engine that build on 1.88 (see s1-store/DEPS.md).
rust-version = "1.88"
publish = false

# Deliberately standalone: NOT in server/Cargo.toml, no workspace parent.
[workspace]

[dependencies]
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

redb = "2.6"
fjall = "2.11"
heed = { version = "0.22", default-features = false }

[profile.release]
debug = 1
