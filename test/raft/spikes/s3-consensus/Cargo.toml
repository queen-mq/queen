# WP-0.5 / spike S3: a 3-process openraft cluster over real TCP.
#
# Standalone crate on purpose: it is NOT a member of server/Cargo.toml and must
# never become one (PLAN_RAFT.md rules of engagement). Build it from this
# directory.
#
# openraft is pinned to the git commit that carries `LogEntryDiscarded`
# (54094270, 2026-09-15). The published 0.10.0-alpha.34 does not have it: there
# a client_write that was appended and then discarded comes back as a plain
# `ForwardToLeader`, indistinguishable from "never appended" (GH#2095).
[package]
name = "s3-consensus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
openraft = { git = "https://github.com/databendlabs/openraft.git", rev = "54094270ede0b8a2eb6ed6ae990edc6ca19d98ec", features = ["serde", "type-alias"] }
raft-log = "0.4.6"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
openraft-memstore = { git = "https://github.com/databendlabs/openraft.git", rev = "54094270ede0b8a2eb6ed6ae990edc6ca19d98ec" }
tempfile = "3"

[profile.release]
debug = 1
