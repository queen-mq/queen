# WP-0.5 / spike S3: a 3-process openraft cluster over real TCP.
#
# Standalone crate on purpose: it is NOT a member of server/Cargo.toml and must
# never become one (PLAN_RAFT.md rules of engagement). Build it from this
# directory.
#
# Use the published release containing `LogEntryDiscarded` (GH#2095).
[package]
name = "s3-consensus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
openraft = { version = "=0.10.0-alpha.37", features = ["serde", "type-alias"] }
# Keep transitive prerelease dependencies on the same API version.
openraft-macros = "=0.10.0-alpha.37"
openraft-rt = "=0.10.0-alpha.37"
openraft-rt-tokio = "=0.10.0-alpha.37"
raft-log = "0.4.6"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
openraft-memstore = { version = "=0.10.0-alpha.37" }
tempfile = "3"

[profile.release]
debug = 1
