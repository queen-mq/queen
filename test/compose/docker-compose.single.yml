# Single-node stack: ONE raft broker + one test runner. There is no database:
# the broker is a single raft voter (the local replicator) whose state lives in
# QUEEN_RAFT_DIR on the `raftdata` volume below.
#
# The project name (docker compose -p ...) makes each (suite x topology)
# invocation an isolated network namespace, so nothing here publishes host
# ports: the runner reaches the broker by service name. test/run.sh always tears
# the project down with `down -v`, so every lane boots on an EMPTY data
# directory — which is what the suites' fixed-name fixtures (e.g. the docs
# snippets' fixed transactionIds) rely on: there is no cleanup to run.
#
# QUEEN_TEST_TENANCY selects the lane: `false` (topology `single`) is the
# flag-off path; `true` (topology `tenanted`) starts the broker with native
# tenant scoping ON while the client suites send NO x-queen-tenant header, i.e.
# the default-tenant path, whose results must be IDENTICAL to the flag-off lane
# (run.sh's TENANCY PARITY gate). The `tenancy` suite also runs here with the
# flag on, sending the header itself (QUEEN_A_URL = QUEEN_B_URL = this node).
#
# Bring up via test/run.sh, which sets QUEEN_RUNNER_IMAGE. Standalone example:
#   QUEEN_RUNNER_IMAGE=queen-test-runner-js \
#     docker compose -p queen-test-js-single -f test/compose/docker-compose.single.yml \
#     up --abort-on-container-exit --exit-code-from runner

services:
  broker:
    image: queen:test
    # No `depends_on`: nothing to wait for. /health answers 503 ("settling")
    # until the state machine is open and ready, then 200; the runner's
    # wait-for-broker gates on that.
    environment:
      # The raft data directory: required (the broker refuses to boot without
      # it). On the `raftdata` volume, so each lane starts empty.
      QUEEN_RAFT_DIR: /var/lib/queen/raft
      PORT: "6632"
      # The leader's maintenance cadence (retention, trace expiry). 5000 is the
      # default; it is pinned here because the runner's
      # QUEEN_RETENTION_INTERVAL_MS below must say the same number.
      RETENTION_INTERVAL: "5000"
      QUEEN_TENANCY_HEADER: "${QUEEN_TEST_TENANCY:-false}"
      # Required by the broker's boot interlock whenever the tenant header is on:
      # with the header on, the tenant is opaque and validated against nothing,
      # so any caller could address another tenant's key space BY NAME. The
      # affirmation is truthful here — the runner is the only client on this
      # network. Harmless on the `single` lane, where the header is off.
      QUEEN_KV_TRUSTED_PROXY: "1"
      # With QUEEN_TENANCY_HEADER on, QUEEN_KV_REQUIRE_GRANT DERIVES to true and
      # the ABSENCE of a per-tenant kv grant is a 403 `feature_gated`. Correct for
      # a cloud cell (granting is provisioning), unsatisfiable here: nothing can
      # grant the default tenant before the runner's first kv call. Left derived,
      # every kv test answers 403 on the `tenanted` lane and the lane can never be
      # IDENTICAL to `single`. Set it to `true` for a one-off check of the denial.
      QUEEN_KV_REQUIRE_GRANT: "${QUEEN_TEST_KV_REQUIRE_GRANT:-false}"
    volumes:
      - raftdata:/var/lib/queen/raft

  runner:
    image: ${QUEEN_RUNNER_IMAGE:?set QUEEN_RUNNER_IMAGE (e.g. queen-test-runner-js)}
    depends_on:
      - broker
    environment:
      QUEEN_HTTP_URL: http://broker:6632
      QUEEN_WAIT_URLS: http://broker:6632/health
      # The `tenancy` suite drives two broker URLs; on one node both are it.
      QUEEN_A_URL: http://broker:6632
      QUEEN_B_URL: http://broker:6632
      # Tells the CLI suite's retention tests the broker's RETENTION_INTERVAL
      # above -- it configures NOTHING, it only sizes their wait. Unset, they
      # t.Skip. Must equal the broker's RETENTION_INTERVAL.
      QUEEN_RETENTION_INTERVAL_MS: "5000"

volumes:
  raftdata:
