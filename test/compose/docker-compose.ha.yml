# HA stack: a THREE-node raft cluster + one test runner. No database: the
# cluster is its own source of truth (openraft replicates every command to a
# majority before it is applied), and each node keeps its state in its own
# QUEEN_RAFT_DIR volume.
#
# The environment is helm_v2/broker's statefulset for replicas=3, with the node
# ids spelled out instead of derived from a StatefulSet ordinal:
#   QUEEN_RAFT_REPLICATOR=openraft    a cluster needs the openraft replicator
#   QUEEN_RAFT_NODE_ID                1, 2, 3
#   QUEEN_RAFT_PEERS                  id=raft_addr/http_addr for every voter; the
#                                     same list on every node. Raft RPCs go to
#                                     :7400, a follower forwards client requests
#                                     to the leader's :6632
#   QUEEN_RAFT_TOKEN                  shared secret every Raft RPC carries
# All three start on EMPTY data directories (test/run.sh tears the project down
# with `down -v`), each initializes the cluster from the same list, and they
# elect a leader. Until a node is ready (leader known, apply caught up) its
# /health answers 503 "settling"; the runner waits for all three.
#
# Client suites point at queen-1, which may be the leader or a follower — either
# way the answer must be the same, which is the point of the lane. The
# `tenancy` suite (topology `ha-tenanted`) drives queen-1 and queen-2.
#
# QUEEN_TEST_TENANCY selects the lane: `false` (topology `ha`) is the flag-off
# path; `true` (topology `ha-tenanted`) starts every node with native tenant
# scoping ON, which is what the `tenancy` suite needs.
#
# Bring up via test/run.sh (`--topo ha`), which sets QUEEN_RUNNER_IMAGE.

x-broker-env: &broker-env
  QUEEN_RAFT_DIR: /var/lib/queen/raft
  QUEEN_RAFT_REPLICATOR: openraft
  QUEEN_RAFT_PEERS: "1=queen-1:7400/queen-1:6632,2=queen-2:7400/queen-2:6632,3=queen-3:7400/queen-3:6632"
  QUEEN_RAFT_TOKEN: queen-harness-raft-token
  PORT: "6632"
  # Leader maintenance cadence; must equal the runner's QUEEN_RETENTION_INTERVAL_MS.
  RETENTION_INTERVAL: "5000"
  QUEEN_TENANCY_HEADER: "${QUEEN_TEST_TENANCY:-false}"
  # Boot interlock for the tenant header, and the kv grant rule turned off for
  # the test stack: see docker-compose.single.yml for why both are needed and
  # truthful on this network.
  QUEEN_KV_TRUSTED_PROXY: "1"
  QUEEN_KV_REQUIRE_GRANT: "${QUEEN_TEST_KV_REQUIRE_GRANT:-false}"

services:
  queen-1:
    image: queen:test
    # The hostname is also the node's name in stats and the dashboard
    # (QUEEN_SERVER_ID falls back to HOSTNAME).
    hostname: queen-1
    environment:
      <<: *broker-env
      QUEEN_RAFT_NODE_ID: "1"
    volumes:
      - data-1:/var/lib/queen/raft

  queen-2:
    image: queen:test
    hostname: queen-2
    environment:
      <<: *broker-env
      QUEEN_RAFT_NODE_ID: "2"
    volumes:
      - data-2:/var/lib/queen/raft

  queen-3:
    image: queen:test
    hostname: queen-3
    environment:
      <<: *broker-env
      QUEEN_RAFT_NODE_ID: "3"
    volumes:
      - data-3:/var/lib/queen/raft

  runner:
    image: ${QUEEN_RUNNER_IMAGE:?set QUEEN_RUNNER_IMAGE (e.g. queen-test-runner-js)}
    depends_on:
      - queen-1
      - queen-2
      - queen-3
    environment:
      QUEEN_HTTP_URL: http://queen-1:6632
      QUEEN_WAIT_URLS: "http://queen-1:6632/health http://queen-2:6632/health http://queen-3:6632/health"
      QUEEN_A_URL: http://queen-1:6632
      QUEEN_B_URL: http://queen-2:6632
      # Sizes the CLI retention tests' wait; must equal RETENTION_INTERVAL above.
      QUEEN_RETENTION_INTERVAL_MS: "5000"

volumes:
  data-1:
  data-2:
  data-3:
