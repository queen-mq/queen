# raft1 stack: ONE broker on QUEEN_STORAGE=raft, NO Postgres, one test runner.
# PLAN_RAFT.md §13.3 (the `raft1` topology) and WP-1.9 (the RAFT PARITY gate).
#
# This is the whole point of G-2 ("no Postgres in raft mode"): there is no `pg`
# service here at all. The broker boots on the replicated state machine
# (LocalReplicator, phase 1) with its data directory on a named volume, and the
# runner reaches it by service name on the project's private network exactly as
# the `single` stack does — nothing binds a host port.
#
# The named volume gives the node a real filesystem for the §11.1 data dir
# (LOCK, IDENTITY, the consensus log, the heed store, the segment files); it is
# wiped on every run because test/run.sh always tears the project down with
# `down -v`, so each lane starts on an empty store — which is what makes the
# fixed-transactionId dedup fixtures (docs.js) reproducible without the SQL
# cleanup the Postgres lanes run (there is no SQL to run: no database).
#
# QUEEN_TEST_STORAGE=raft is the lane signal the runner reads (test-v2/run.js and
# the per-language entrypoints): it turns OFF the direct-Postgres setup/cleanup
# (there is none) and turns ON the phase-1 skip set — every test that needs a
# route the raft broker does not serve yet (queue admin/configure, transaction,
# kv, timers, streams, consumer-group admin, dashboard/analytics reads) is
# skipped LOUDLY, printed with its reason, so the RAFT PARITY gate compares only
# the message-path tests both lanes actually run (§13.3, WP-1.9).
#
# Bring up via test/run.sh (which sets QUEEN_RUNNER_IMAGE). Standalone example:
#   QUEEN_RUNNER_IMAGE=queen-test-runner-js \
#     docker compose -p queen-test-js-raft1 -f test/compose/docker-compose.raft1.yml \
#     up --abort-on-container-exit --exit-code-from runner

services:
  broker:
    image: queen:test
    # No `depends_on`: there is no Postgres to wait for. The broker binds its
    # HTTP listener as soon as the state machine facade is open (§11.5 step 6),
    # and the runner's wait-for-broker gates on /health returning 200.
    environment:
      QUEEN_STORAGE: raft
      # §11.1 — the raft data directory. Required in raft mode (run_raft fatals
      # on an empty value); it lives on the `raftdata` volume below.
      QUEEN_RAFT_DIR: /var/lib/queen/raft
      PORT: "6632"
      # Phase 1 is one voter (embedded/single-node = 1 voter, D2), so there is no
      # peer traffic and no QUEEN_RAFT_SECRET is required (multi-node refuses to
      # boot without one, D12; a single voter does not).
      #
      # Tenancy stays OFF on raft1: there is no raft-tenanted lane in phase 1
      # (§13.3 lists raft3-tenanted for later), and the message path the gate
      # compares is tenant-agnostic here (one runner, default tenant).
      QUEEN_TENANCY_HEADER: "false"
      # Pop fusion follows the env like the single stack, so the same matrix
      # validates both sides of the flag (unset = off = the byte-identical path).
      QUEEN_POP_FUSION: "${QUEEN_POP_FUSION:-0}"
    volumes:
      - raftdata:/var/lib/queen/raft

  runner:
    image: ${QUEEN_RUNNER_IMAGE:?set QUEEN_RUNNER_IMAGE (e.g. queen-test-runner-js)}
    depends_on:
      - broker
    environment:
      QUEEN_HTTP_URL: http://broker:6632
      QUEEN_WAIT_URLS: http://broker:6632/health
      # The lane signal. Every runner reads this: skip the Postgres setup/cleanup
      # (there is no database) and apply the phase-1 skip set, loudly.
      QUEEN_TEST_STORAGE: raft
      # No QUEEN_PG_* here on purpose: a raft broker has no Postgres, and a runner
      # that tries to open a cleanup pool on this network would hang then fail.
      # The runners gate their DB setup on QUEEN_TEST_STORAGE=raft.
      QUEEN_RETENTION_INTERVAL_MS: "5000"

volumes:
  raftdata:
