[package]
# crates.io package name. The bare name "queen" is taken on crates.io by an
# unrelated crate, so the package publishes as queen-engine while the [lib]
# below keeps the import path `use queen::...` (and the [[bin]] keeps the
# binary name) — nothing in the repo tooling or in user code changes.
name = "queen-engine"
version = "1.4.0"
edition = "2021"
# Measured floor, not copied: `cargo +1.88 check` passes for both feature sets;
# 1.86 fails because jsonwebtoken -> simple_asn1 floors `time` at 0.3.55, which
# requires rustc 1.88. (The queen-mq client sits at 1.86 — different dep tree.)
rust-version = "1.88"
description = "The QueenMQ broker engine: a PostgreSQL-backed message broker with partitions, consumer groups, transactions and streams — embeddable in-process as queen::Broker, or run as the standalone queen binary."
license = "Apache-2.0"
homepage = "https://queenmq.com"
repository = "https://github.com/queen-mq/queen"
readme = "README.md"
keywords = ["queue", "message-queue", "postgresql", "broker", "embedded"]
categories = ["asynchronous", "database", "network-programming"]
# Internal bench/ops artifacts that must not ship in the .crate. webapp/dist is
# deliberately NOT excluded: the tracked subset keeps the `server` feature
# compiling from a packaged crate (rust-embed hard-errors on a missing folder);
# the full dashboard bundle is a repo/Docker build product, not crate content.
exclude = [
  "runAcd.png",
  "runAcd.csv",
  "fusion_directspawn_experiment.rs.txt",
  "plot_run.py",
  "mesh-verify.sh",
  "pop-targeted-verify.sh",
  "setup-broker.sh",
  "Dockerfile",
  ".dockerignore",
]

[lib]
name = "queen"
path = "src/lib.rs"

[[bin]]
name = "queen"
path = "src/main.rs"
# The binary is the full HTTP broker; embedders build with
# default-features = false and never compile it.
required-features = ["server"]

[features]
# Default ON so every in-repo workflow (cargo build/test, Dockerfile, CI) is
# byte-identical to the pre-feature layout. `server` covers what only the HTTP
# broker needs: the axum serve stack, the embedded dashboard, and the process
# tracing subscriber. The embedded library path (queen::Broker) never needs it.
default = ["server"]
server = ["dep:rust-embed", "dep:tracing-subscriber", "axum/http1", "axum/tokio"]

[dependencies]
tokio = { version = "1", features = ["full"] }
# Lean by default: the embedded facade and the handlers need only axum's core
# extractor/response types plus Query. The hyper/http1 serve stack is pulled in
# by the `server` feature above.
axum = { version = "0.7", default-features = false, features = ["query"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
rand = "0.8"
zstd = "0.13"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# At-rest payload encryption (RUSTFIX item 8): AES-256-GCM with a 16-byte IV,
# wire-compatible with the C++ EncryptionService envelope.
aes-gcm = "0.10"
# Postgres TLS (RUSTFIX item 5). rustls (pure-Rust, statically linked) with the
# `ring` crypto provider so the Debian build image needs only a C compiler — no
# cmake (aws-lc-rs) and no system OpenSSL (native-tls) in the slim runtime image.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
# tokio-rustls drives the self-contained JWKS HTTPS client (src/httpget.rs).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# hex-decode QUEEN_ENCRYPTION_KEY (item 8) + parse assorted hex config.
hex = "0.4"
# Log-engine dedup hashing (doc 18 §3): xxh3_128(txn) is the broker-side txn
# fingerprint stored in queen.log_txns; SQL only ever compares the 16B bytea.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Full JWT verification (RUSTFIX item 7): HS256/384/512, RS256/384/512, EdDSA.
# jsonwebtoken 9 uses `ring` (no aws-lc-rs), consistent with the rustls choice
# above, so the Docker build stays cmake-free. JWKS is fetched over the bundled
# tokio-rustls client (src/httpget.rs) — no reqwest / second TLS backend.
jsonwebtoken = "9"
# getrusage(2) for cross-platform process CPU + RSS in the metrics collector
# (syscollect.rs). Tiny, ubiquitous, no_std-friendly FFI shim only.
libc = "0.2"
# Embed the built Vue dashboard (webapp/dist) into the binary so the broker
# serves the SPA with zero external files — single self-contained binary.
# Optional: only the `server` feature serves the dashboard; an embedding
# application brings its own UI.
rust-embed = { version = "8", optional = true }
# Structured logging (LOGGING_PLAN.md). `tracing` macros + a `tracing-subscriber`
# fmt layer with an EnvFilter that honours LOG_LEVEL/RUST_LOG (previously the
# Helm-injected LOG_LEVEL was dead). `time` feature = RFC3339 UTC timestamps
# without pulling chrono; `json` = the QUEEN_LOG_JSON=1 structured formatter.
# Pure-Rust, no C deps (consistent with the ring/no-cmake build).
tracing = "0.1"
# Optional: obs::init installs the process-wide subscriber for the BINARY only.
# The library never installs one (the host application owns tracing), so
# embedders do not compile it.
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "env-filter", "ansi", "std", "time", "json"] }
# Canonical wire types, shared with the Rust client. The HTTP request parsers
# stay zero-copy (`PushItem<'a>` borrows out of the request body) and the
# responses are still rendered by hand into a pre-sized String — both are
# load-bearing for push/pop throughput and neither uses these owned serde
# types. They are a regular dependency (was dev-only) because the embedded
# library facade (src/embedded/) takes and returns them as its public API; the
# conformance tests in `handlers::data::protocol_conformance` keep pinning the
# hand-rendered bytes to these types, so a field that drifts on either side
# fails a test instead of silently reaching a client.
queen-protocol = { path = "../crates/queen-protocol", version = "1.3.0" }
# EPHEMERAL_QUEUES.md §3.6 (M2) — the broker→broker forwarding client
# (src/peerclient.rs). Same crates and same versions as the proxy's upstream
# client, which is the repository's ONE HTTP client pattern: "no reqwest by
# design". hyper itself is not named here — the pooled client is reached through
# hyper-util and the bodies are axum's, so a direct hyper dependency would only
# be a second place for the major version to drift.
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
