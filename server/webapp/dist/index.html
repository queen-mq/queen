<!DOCTYPE html>

    <title>Queen - Message Queue Dashboard</title>
    
    <!-- Fonts. Variable axes, not a weight list: the stylesheet asks for 450
         and 550 in several places (.card-header h3, .stat-label) and Google
         Fonts only ships static instances at 100-step intervals, so those two
         were silently rounding to 400/500. `wght@100..900` serves the variable
         face, which is also what the docs site self-hosts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Theme initialization (prevent flash) -->
    <!-- Same resolution as src/composables/useTheme.js resolveTheme(): stored
         choice wins, else the OS but only when it asks for LIGHT, else dark.
         It runs here, before any bundle, so the first painted frame is already
         the right scheme — on every SPA route, including hard reloads of pages
         that pull no chart chunk (e.g. /messages). Keep in sync with
         useTheme.js; that module re-runs the same policy on boot. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var stored = localStorage.getItem('queen-theme');
          if (stored === 'light' || stored === 'dark') t = stored;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) { /* storage or matchMedia unavailable: stay dark */ }
        var root = document.documentElement;
        root.classList.toggle('light', t === 'light');
        root.classList.toggle('dark', t !== 'light');
        root.style.colorScheme = t;
      })();
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-BgkVSINz.css">
  </head>
