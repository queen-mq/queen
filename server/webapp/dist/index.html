    <title>Queen - Message Queue Dashboard</title>
    
    <!-- Fonts. Variable axes, not a weight list: the stylesheet asks for 450
         and 550 in several places (.card-header h3, .stat-label) and Google
         Fonts only ships static instances at 100-step intervals, so those two
         were silently rounding to 400/500. `wght@100..900` serves the variable
         face, which is also what the docs site self-hosts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Theme initialization (prevent flash) -->
    <!-- App is dark-only. Force dark before any bundle loads so SPA routes
         that don't pull the chart chunk (e.g. /messages on hard reload) still
         render correctly. -->
    <script>
      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
    </script>
    <script type="module" crossorigin src="/assets/index-DFHOlPQO.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CXOrWPy6.css">
  </head>
  <body class="antialiased">
    <div id="app"></div>
  </body>
