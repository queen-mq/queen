[package]
name = "queen-kafka"
version = "1.3.0"
edition = "2021"
description = "Kafka wire-protocol front for QueenMQ: unmodified Kafka clients produce and consume against a Queen broker by changing bootstrap.servers only."
license = "Apache-2.0"
homepage = "https://queenmq.com"
repository = "https://github.com/queen-mq/queen"
publish = false

[lib]
name = "queen_kafka"
path = "src/lib.rs"

[[bin]]
name = "queen-kafka"
path = "src/main.rs"

[dependencies]
# Same pin and feature set as server/Cargo.toml and proxy/Cargo.toml, so the
# three binaries share one tokio build in a CI cache.
tokio = { version = "1", features = ["full"] }
# LengthDelimitedCodec only: Kafka frames are a 4-byte big-endian length
# followed by the request/response bytes. The codec is driven directly through
# the Decoder/Encoder traits (see conn.rs) rather than through Framed, which
# keeps futures-util out of the tree and makes the serial dispatch the plan
# requires the obvious shape of the loop.
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = "1"
# Every Kafka message type, the request/response header schemas and their
# per-(api_key, api_version) header versions. `broker` is the half of the crate
# this side needs: decode requests, encode responses. Compression is off — it is
# a RecordBatch concern and arrives with Produce in M2.
kafka-protocol = { version = "0.18", default-features = false, features = ["broker"] }
# The Queen side (src/queen.rs). Same crate, version and feature set as
# clients/client-rust, which is the repository's HTTP *client* pattern: rustls
# with the `ring` provider (no OpenSSL on the host, no cmake in the build) and
# nothing else from the defaults. The server and the proxy use hyper-util
# instead, but they are servers — this is a client of the broker, exactly like
# the SDK.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
# The tests drive the exchange from the CLIENT side with kafka-protocol's own
# types — encode requests, decode responses — which is the other half of the
# crate. Cargo unifies features per build, so `cargo test` gets broker+client
# while `cargo build` still compiles broker alone.
kafka-protocol = { version = "0.18", default-features = false, features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
