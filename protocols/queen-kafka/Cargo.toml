[package]
name = "queen-kafka"
version = "2.0.0"
edition = "2021"
description = "Kafka wire protocol for QueenMQ: a translation layer from Kafka requests to the operations of the Queen broker it runs inside."
license = "Apache-2.0"
homepage = "https://queenmq.com"
repository = "https://github.com/queen-mq/queen"
publish = false

[lib]
name = "queen_kafka"
path = "src/lib.rs"

[dependencies]
# Same pin and feature set as server/Cargo.toml, so the two share one tokio build.
tokio = { version = "1", features = ["full"] }
bytes = "1"
# Every Kafka message type and the request/response header schemas. `broker` is
# the half this side needs: decode requests, encode responses. The four codecs
# are the producer's choice (`compression.type`), so all four are built.
kafka-protocol = { version = "0.18", default-features = false, features = [
    "broker",
    "gzip",
    "snappy",
    "lz4",
    "zstd",
] }
# The codec crates themselves, for the bounded decompressors in src/decompress.rs.
flate2 = "1"
snap = "1"
lz4 = "1.24"
zstd = "0.13"
# The record envelope's alphabet (src/records.rs).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"

[dev-dependencies]
kafka-protocol = { version = "0.18", default-features = false, features = ["client", "broker"] }
tokio = { version = "1", features = ["test-util"] }
