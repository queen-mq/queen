# queen-kafka compat: Spring Boot + spring-kafka
#
# Deliberately minimal.  Everything here is either (a) noise control so the
# "  ok" / "  FAIL" lines stay readable, or (b) THE one property a real Boot
# service must set to talk to queen-kafka at all.

spring.main.banner-mode=off
spring.main.web-application-type=none

# ---- this suite's own choice, NOT a requirement any more --------------------
# kafka-clients >= 3.0 defaults enable.idempotence=true.  That used to be fatal
# here (no InitProducerId), and this property was the one mandatory deviation
# from stock Boot.  M7 F3 advertises InitProducerId v0-4 and enforces the
# sequence window, so a stock Boot producer sends: phase 10 measures exactly
# that.  The flag is kept OFF for the suite's own producers so the other phases
# keep measuring the non-idempotent path.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=false
spring.kafka.producer.properties.max.block.ms=30000

spring.kafka.consumer.auto-offset-reset=earliest

# Boot's default is already false, pinned only so the suite's timings are stable.
# Setting it to true is SAFE against queen-kafka: it makes spring-kafka call
# KafkaAdmin.describeTopics, which is Metadata underneath, and Metadata 0-9 is
# advertised.  Phase 9b of the suite measures this rather than assuming it.
# NewTopic beans are safe too since M7 F1: they reach CreateTopics, which the
# facade advertises v2-6.  The one shape it still refuses is cleanup.policy=compact.
spring.kafka.listener.missing-topics-fatal=false

# ---- noise control ---------------------------------------------------------
logging.level.root=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.pattern.console=%-5level %logger{25} - %msg%n
