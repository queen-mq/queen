[package]
name = "queen-proxy"
version = "1.0.0-beta.3"
edition = "2021"

[[bin]]
name = "queen-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
# Upstream client: pure hyper (pooled, streaming). No reqwest by design — the repo
# is deliberately cmake-free/rustls-only (see server/src/httpget.rs header); the
# broker upstream is plaintext HTTP inside the cell network, so no client TLS at all.
# `server` + hyper-util `service` are the OPTIONAL TLS listener (main.rs): axum
# 0.7's `axum::serve` takes a plain TcpListener, so an HTTPS leg has to drive a
# hyper connection per accepted stream with the Router as the service. Features
# on crates already in the tree — no new dependency, still cmake-free.
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio", "service"] }
http-body-util = "0.1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
rand = "0.8"
# Ed25519 public-key derivation from the private PKCS#8 PEM (auth.rs). ring is
# already in the tree (jsonwebtoken 9 + rustls both depend on ring 0.17), so
# surfacing it as a direct dep pulls zero new crates and stays cmake-free.
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Embeds the built console SPA (console/dist) into the binary — same crate,
# same pattern as server/Cargo.toml + server/src/handlers/static_files.rs.
rust-embed = "8"

[profile.release]
lto = "thin"
codegen-units = 1
